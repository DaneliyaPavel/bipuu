name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Forbidden content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inherited identity, third-party identifiers and protected media (tree and history)
        run: bash scripts/forbidden-content-check.sh --history

  macos:
    name: macOS build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd Bipuu && xcodegen

      - name: Standalone tests
        run: |
          set -e
          for s in scripts/test-*.sh; do
            echo "== $s"
            bash "$s"
          done

      - name: Build (unsigned)
        run: |
          xcodebuild -project Bipuu/Bipuu.xcodeproj -scheme Bipuu -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
