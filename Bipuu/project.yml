name: Bipuu
options:
  # Provisional: confirm the reverse-DNS domain Bipuu owns before the first signed release.
  # See docs/IDENTIFIERS.md.
  bundleIdPrefix: app.bipuu
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # Prevent Xcode from scanning Swift source and rewriting Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      # Developer ID signing. The team is supplied locally (BIPUU_DEVELOPMENT_TEAM in an
      # untracked xcconfig or the environment); nothing account-specific is committed.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

schemes:
  Bipuu:
    build:
      targets:
        Bipuu: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Bipuu:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/hook
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Bipuu
        CFBundleDisplayName: Bipuu
        CFBundleIdentifier: app.bipuu.Bipuu
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bipuu.Bipuu
        PRODUCT_NAME: Bipuu
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
    postBuildScripts:
      - name: "Write Git Hash to Info.plist"
        script: |
          HASH=$(git -C "${SRCROOT}/.." rev-parse --short HEAD 2>/dev/null || echo "unknown")
          /usr/libexec/PlistBuddy -c "Set :BipuuGitHash ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :BipuuGitHash string ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        showEnvVars: false
